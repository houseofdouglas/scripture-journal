name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build Lambda
        run: npm run build:lambda

      - name: Build frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::818371815071:role/scripture-journal-github-actions
          aws-region: us-east-1

      # Infrastructure first: code that depends on new resources (e.g. the
      # /content/assets/* CloudFront behaviours) must not ship before them.
      # Terraform also deploys dist/lambda.zip (source_code_hash), so the
      # explicit update-function-code below is a harmless no-op re-upload.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -var="env=dev" -out=tfplan

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false tfplan

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name scripture-journal-api-dev \
            --zip-file fileb://dist/lambda.zip

      - name: Sync SPA to S3
        run: |
          aws s3 sync dist/spa/ s3://scripture-journal-spa-818371815071-dev/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2EN9YI9VWIL3M \
            --paths "/*"
